<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="VetHub - Veterinary Clinic Management System by ilionx" />
		<meta name="theme-color" content="#E8003D" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Fredoka:wght@300;400;500;600&display=swap" rel="stylesheet" />
		<!-- Prevent theme flash on page load by applying saved theme before render -->
		<script>
			(function() {
				const theme = localStorage.getItem('theme') || 'light';
				if (theme !== 'light') {
					document.documentElement.classList.add(theme);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
